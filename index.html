const $=s=>document.querySelector(s),LET='CDEFGAB',SM=[0,2,4,5,7,9,11],BOT={t:30,b:18,a:24,n:22},CL={t:[-1.3,5.5],b:[0,4],a:[0,4],n:[-.8,4]},MODES=['learn','challenge','endless'],

let S={lang:'en',mode:'challenge',level:1,mute:false,speed:1,solf:true,hints:false,rm:matchMedia('(prefers-reduced-motion:reduce)').matches,acc:true,best:{},stars:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('noteCatcher')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('noteCatcher',JSON.stringify(S))}catch(e){}},tr=k=>T[S.lang][k],E=()=>S.mode=='endless',show=i=>$(i).classList.add('on'),hide=i=>$(i).classList.remove('on');
let st='menu',stars=[],fx=[],floats=[],clock0=performance.now(),paused0=0,idx=0,nextSp=0,score=0,combo=0,bestC=0,lives=3,J={P:0,G:0,O:0,M:0},cat={x:0,mood:'idle',t:0},flash=null,shake=0,lastN=-1,lastLane=-1,latch=false,AC,W=300,H=500,D=1,LY=400,CR=40,R=60,lastTs=0;
const now=()=>(st=='pause'?paused0:performance.now())-clock0,
bg=Array.from({length:14},(_,i)=>({u:Math.random(),v:Math.random(),s:14+Math.random()*20,sp:.015+Math.random()*.03,ch:'♪♫'[i%2]})),
cv=$('#cv'),x=cv.getContext('2d');
if(!x.roundRect)x.roundRect=function(a,b,c,d){this.rect(a,b,c,d)};

new ResizeObserver(size).observe($('#stage'));

/* audio */
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
function tone(nt){if(S.mute||!AC)return;const m=12*((nt.n/7|0)+1)+SM[nt.n%7]+nt.a,f=440*2**((m-69)/12),t=AC.currentTime,g=AC.createGain();
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+1.1);g.connect(AC.destination);
[[f,'triangle',1],[f*2,'sine',.35],[f*3,'sine',.12]].forEach(([fr,ty,v])=>{const o=AC.createOscillator(),h=AC.createGain();o.type=ty;o.frequency.value=fr;h.gain.value=v;o.connect(h);h.connect(g);o.start(t);o.stop(t+1.2)})}
function bonk(){if(S.mute||!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(70,t+.18);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3)}

/* game logic */
const acc=()=>{const n=J.P+J.G+J.O+J.M;return n?(J.P+.85*J.G+.6*J.O)/n:1};
function params(i){const L=LV[S.level-1],e=E(),p=e?Math.min(1,i/60):Math.min(1,i/29);let f=e?3.2-1.9*p:L.f[0]+(L.f[1]-L.f[0])*p,g=e?f*.62:L.g[0]+(L.g[1]-L.g[0])*p;const k=(S.mode=='learn'?1.35:1)/S.speed;return{f:f*k,g:g*k}}
function gen(i){let L=LV[S.level-1],sets=L.c,ac=L.a&&S.acc;
if(E()){sets=i<10?LV[1].c:i<25?LV[3].c:[...LV[4].c,['a',21,31],['n',19,29]];ac=false}
const [c,lo,hi]=sets[Math.random()*sets.length|0];let n;do n=lo+(Math.random()*(hi-lo+1)|0);while(n==lastN&&hi>lo);lastN=n;
const l=n%7;let a=0;if(ac&&Math.random()<.28){if(Math.random()<.5){if([0,1,3,4,5].includes(l))a=1}else if([6,2,5,1,4].includes(l))a=-1}
return{c,n,a,key:a<0?(l+6)%7:l,sh:a!=0}}
function spawn(t){const p=params(idx);let lane;do lane=Math.random()*4|0;while(lane==lastLane);lastLane=lane;stars.push({lane,note:gen(idx),hit:t+p.f*1000,f:p.f*1000,st:0});idx++;nextSp=t+p.g*1000;hud()}
function startGame(){au();st='play';stars=[];fx=[];floats=[];flash=null;idx=0;score=combo=bestC=0;lives=3;J={P:0,G:0,O:0,M:0};lastN=lastLane=-1;clock0=performance.now();nextSp=900;
['#menu','#pause','#over','#set'].forEach(hide);$('#keys').classList.toggle('acc',!E()&&S.level==5&&S.acc);latch=false;$('#sh').classList.remove('on');size();hud()}
function press(k,sh){if(st!='play')return;au();const b=document.querySelector(`.k[data-k=${LET[k]}]`);b.classList.add('dn');setTimeout(()=>b.classList.remove('dn'),120);
const t=now(),c=stars.filter(s=>!s.st).sort((a,b)=>a.hit-b.hit)[0];if(!c||Math.abs(c.hit-t)>250){bonk();return}
const d=Math.abs(c.hit-t);if(k==c.note.key&&sh==c.note.sh)judge(d<=80?'P':d<=160?'G':'O',c,t);else miss(c,t,1)}
function judge(j,c,t){J[j]++;combo++;bestC=Math.max(bestC,combo);score+={P:300,G:200,O:100}[j]*Math.min(4,1+(combo/10|0));c.st=1;c.rt=t;tone(c.note);cat.mood=j=='P'?'happy':'idle';cat.t=t+700;pop(j,c);
if(!S.rm){const cx=W*(c.lane+.5)/4;for(let i=0;i<9;i++){const a=Math.random()*6.28,v=80+Math.random()*160;fx.push({x:cx,y:LY,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,l:.8,ch:'♪★♫✦'[i%4]})}}hud()}
function miss(c,t,wrong){J.M++;combo=0;c.st=2;c.rt=t;if(wrong)bonk();cat.mood='sad';cat.t=t+900;pop('M',c);shake=S.rm?0:10;
if(S.mode=='learn')flash={n:c.note,t:t+1900};else lives--;hud();if(S.mode!='learn'&&lives<=0)finish(false)}
function pop(j,c){floats.push({x:W*(c.lane+.5)/4,y:LY-R*.9,t:now(),s:IC[j]+tr('J')[j]})}
function hud(){const m=Math.min(4,1+(combo/10|0)),l=Math.max(0,lives);$('#hr').textContent=S.mode=='learn'?'♥ ∞':'♥'.repeat(l)+'♡'.repeat(3-l);$('#sc').textContent=score;$('#cb').textContent=combo+' ×'+m;$('#ac').textContent=Math.round(acc()*100)+'%';$('#pb').style.width=(E()?Math.min(100,idx/.6):idx/.3)+'%'}
function finish(done){if(st=='over')return;st='over';const a=acc(),n=done?(a>=.9?3:a>=.75?2:1):0,k=S.mode+(E()?'':S.level),nb=score>(S.best[k]||0);if(nb)S.best[k]=score;if(!E()&&n>(S.stars[S.level]||0))S.stars[S.level]=n;save();
setTimeout(()=>{if(st!='over')return;$('#ot').textContent=tr(done?'ok':'go');$('#os').textContent=E()?'':'★'.repeat(n)+'☆'.repeat(3-n);

/* drawing */
const el=(a,b,c,d,f)=>{x.beginPath();x.ellipse(a,b,c,d,0,0,7);x.fillStyle=f;x.fill()};
function clef(c,X,Y,s){x.save();x.translate(X,Y);x.scale(s,s);x.lineWidth=.2;x.lineCap=x.lineJoin='round';x.beginPath();
if(c=='t'){x.moveTo(1.4,-1.2);x.lineTo(1.4,5);x.bezierCurveTo(1.4,5.7,.3,5.8,.3,5);x.moveTo(1.4,4);x.bezierCurveTo(-.3,3.6,-.2,1.6,1.5,1.4);x.bezierCurveTo(2.7,1.3,2.9,3.2,1.7,3.5);x.bezierCurveTo(.9,3.7,.4,3,.8,2.5);x.bezierCurveTo(1.1,2.1,1.8,2.3,1.7,2.8);x.moveTo(1.5,1.4);x.bezierCurveTo(1,-.2,1.8,-1.3,2.1,-.6);x.bezierCurveTo(2.3,-.1,1.9,.6,1.5,1.4);x.stroke()}
else if(c=='b'){x.moveTo(.4,1);x.bezierCurveTo(1,-.5,2.7,-.1,2.5,1.7);x.bezierCurveTo(2.3,2.8,1.2,3.5,.1,3.9);x.stroke();x.beginPath();x.arc(.45,1,.38,0,7);x.fill();[.55,1.45].forEach(y=>{x.beginPath();x.arc(3.1,y,.24,0,7);x.fill()})}
else{const m=c=='a'?2:1;x.fillRect(.1,0,.4,4);x.fillRect(.8,0,.14,4);x.moveTo(2.6,m-1.7);x.bezierCurveTo(1.2,m-2,1.2,m-.2,2.4,m-.2);x.moveTo(2.6,m+1.7);x.bezierCurveTo(1.2,m+2,1.2,m+.2,2.4,m+.2);x.stroke()}
x.restore()}
function nota(w,h,nt){const pos=nt.n-BOT[nt.c],yn=4-pos/2;let lo=Math.min(0,yn-.8,CL[nt.c][0]),hi=Math.max(4,yn+.8,CL[nt.c][1]);if(pos<4)lo=Math.min(lo,yn-3.2);else hi=Math.max(hi,yn+3.2);
const s=Math.min(11,h*.88/(hi-lo)),y0=-(lo+hi)/2*s,L=-w/2+w*.05,Rr=w/2-w*.05,nx=L+3.6*s+(Rr-L-3.6*s)/2+s*.3;
x.strokeStyle=x.fillStyle='#1d1538';x.lineCap='round';x.lineWidth=Math.max(1.2,s*.13);
const led=p=>{const y=y0+(4-p/2)*s;x.beginPath();x.moveTo(nx-s,y);x.lineTo(nx+s,y);x.stroke()};
for(let i=0;i<5;i++){x.beginPath();x.moveTo(L,y0+i*s);x.lineTo(Rr,y0+i*s);x.stroke()}
for(let p=-2;p>=pos;p-=2)led(p);for(let p=10;p<=pos;p+=2)led(p);
clef(nt.c,L+.1*s,y0,s);const y=y0+yn*s;x.beginPath();x.ellipse(nx,y,s*.62,s*.46,-.35,0,7);x.fill();
x.beginPath();if(pos<4){x.moveTo(nx+s*.58,y);x.lineTo(nx+s*.58,y-3.2*s)}else{x.moveTo(nx-s*.58,y);x.lineTo(nx-s*.58,y+3.2*s)}x.stroke();
if(nt.a){x.font=`700 ${s*2.4}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(nt.a>0?'♯':'♭',nx-s*1.5,y)}}
function star(cx,cy,r,nt,a,bad){x.save();x.globalAlpha=a;x.translate(cx,cy);x.shadowColor='#8fd3ff';x.shadowBlur=r*.5;x.beginPath();
for(let i=0;i<10;i++){const q=i%2?r*.8:r,an=-Math.PI/2+i*Math.PI/5;x[i?'lineTo':'moveTo'](Math.cos(an)*q,Math.sin(an)*q)}x.closePath();
const g=x.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#bfe4ff');x.fillStyle=g;x.strokeStyle='#dff2ff';x.lineJoin='round';x.lineWidth=r*.2;x.stroke();x.fill();x.shadowBlur=0;
x.beginPath();x.roundRect(-r*.71,-r*.55,r*1.42,r*1.1,r*.14);x.fillStyle='#fff';x.fill();x.strokeStyle='#a9c4ff';x.lineWidth=2;x.stroke();nota(r*1.42,r*1.1,nt);
if(bad){x.strokeStyle='#d6246e';x.lineWidth=r*.12;x.beginPath();x.moveTo(-r*.5,-r*.4);x.lineTo(r*.5,r*.4);x.moveTo(r*.5,-r*.4);x.lineTo(-r*.5,r*.4);x.stroke()}
if(S.hints||S.mode=='learn'){x.beginPath();x.arc(r*.66,r*.66,r*.27,0,7);x.fillStyle='#ff5fa2';x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();x.fillStyle='#fff';x.font=`900 ${r*.3}px ${FF}`;x.textAlign='center';x.textBaseline='middle';x.fillText((nt.sh?'⇧':'')+LET[nt.key],r*.66,r*.68)}
x.restore()}
function catD(t){const r=CR,m=t<cat.t?cat.mood:'idle',O='#ffb35c',C='#fff1dc',K='#2b2147';x.save();x.translate(cat.x,LY+r*.95+(m=='happy'&&!S.rm?-Math.abs(Math.sin(t/110))*r*.3:0));x.lineCap='round';
x.strokeStyle=O;x.lineWidth=r*.3;x.beginPath();x.moveTo(r*.8,r*1.5);x.quadraticCurveTo(r*2,r*1.5+(S.rm?0:Math.sin(t/200)*r*.3),r*1.6,r*.3);x.stroke();
el(0,r*1.3,r*.95,r*.85,O);el(0,r*1.4,r*.5,r*.6,C);el(-r*.45,r*2,r*.3,r*.2,C);el(r*.45,r*2,r*.3,r*.2,C);
[-1,1].forEach(q=>{x.beginPath();x.moveTo(q*r*.95,-r*.1);x.lineTo(q*r*.75,-r*1.1);x.lineTo(q*r*.2,-r*.75);x.closePath();x.fillStyle=O;x.fill();x.beginPath();x.moveTo(q*r*.8,-r*.3);x.lineTo(q*r*.72,-r*.85);x.lineTo(q*r*.38,-r*.68);x.closePath();x.fillStyle='#ff9fc4';x.fill()});
el(0,0,r,r*.9,O);x.strokeStyle='#e88a2e';x.lineWidth=r*.08;[-.25,0,.25].forEach(q=>{x.beginPath();x.moveTo(q*r,-r*.88);x.lineTo(q*r,-r*.62);x.stroke()});el(0,r*.32,r*.46,r*.3,C);
[-1,1].forEach(q=>{const ex=q*r*.4,ey=-r*.05;x.strokeStyle=x.fillStyle=K;x.lineWidth=r*.09;x.beginPath();
if(m=='happy'){x.arc(ex,ey+r*.08,r*.15,Math.PI,0);x.stroke()}else{x.arc(ex,ey,r*.13,0,7);x.fill();if(m=='sad'){x.beginPath();x.moveTo(ex-q*r*.2,ey-r*.3);x.lineTo(ex+q*r*.2,ey-r*.2);x.stroke();el(ex+q*r*.12,ey+r*.3,r*.06,r*.1,'#6ec6ff')}}
x.strokeStyle='#8a5a35';x.lineWidth=2;x.beginPath();x.moveTo(q*r*.5,r*.3);x.lineTo(q*r*.95,r*.22);x.moveTo(q*r*.5,r*.4);x.lineTo(q*r*.95,r*.45);x.stroke();if(m=='happy')el(q*r*.62,r*.3,r*.14,r*.09,'rgba(255,90,140,.5)')});
el(0,r*.22,r*.07,r*.05,'#ff6b9c');x.strokeStyle=K;x.lineWidth=r*.07;x.beginPath();
if(m=='happy'){x.arc(0,r*.38,r*.2,0,Math.PI);x.fillStyle='#c2347a';x.fill()}else if(m=='sad')x.arc(0,r*.58,r*.14,Math.PI,0);else x.arc(0,r*.36,r*.12,0,Math.PI);x.stroke();x.restore()}
function draw(t,dt){x.setTransform(D,0,0,D,0,0);x.clearRect(0,0,W,H);if(shake>.3){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}
for(let i=0;i<4;i++){if(i%2){x.fillStyle='rgba(255,255,255,.12)';x.fillRect(W*i/4,0,W/4,H)}x.strokeStyle='rgba(255,255,255,.35)';x.setLineDash([6,10]);x.lineWidth=2;x.beginPath();x.moveTo(W*i/4,0);x.lineTo(W*i/4,H);x.stroke()}x.setLineDash([]);
x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(255,255,255,.3)';for(const b of bg){if(!S.rm){b.v+=b.sp*dt;if(b.v>1)b.v=0}x.font=`${b.s}px sans-serif`;x.fillText(b.ch,b.u*W+(S.rm?0:Math.sin(b.v*9+b.u*6)*12),(1-b.v)*H)}
const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');
x.shadowColor='#fff';x.shadowBlur=18;x.strokeStyle=g;x.lineWidth=6;x.beginPath();x.moveTo(0,LY);x.lineTo(W,LY);x.stroke();x.shadowBlur=0;
x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;for(let i=0;i<4;i++){x.beginPath();x.arc(W*(i+.5)/4,LY,R*.45,0,7);x.stroke()}
for(const s of stars){const y=-R+(LY+R)*(1-(s.hit-t)/s.f),cx=W*(s.lane+.5)/4;let a=1,k=1;if(s.st==1){const p=(t-s.rt)/250;if(p>1)continue;a=1-p;k=1+.5*p}if(s.st==2){const p=(t-s.rt)/700;if(p>1)continue;a=1-p}star(cx,y,R*k,s.note,a,s.st==2)}
catD(t);x.textAlign='center';x.textBaseline='middle';for(const p of fx){x.globalAlpha=Math.max(0,p.l/.8);x.fillStyle='#fff';x.font='20px sans-serif';x.fillText(p.ch,p.x,p.y)}x.globalAlpha=1;
floats=floats.filter(f=>t-f.t<900);for(const f of floats){const p=(t-f.t)/900;x.globalAlpha=1-p*p;x.font=`900 ${Math.min(26,W/12)|0}px ${FF}`;x.lineWidth=6;x.lineJoin='round';x.strokeStyle='#5b2a9e';x.fillStyle='#fff';x.strokeText(f.s,f.x,f.y-p*50);x.fillText(f.s,f.x,f.y-p*50)}
if(flash&&t<flash.t){const n=flash.n;x.globalAlpha=Math.min(1,(flash.t-t)/900);x.font=`900 ${Math.min(54,W/8)|0}px ${FF}`;x.lineWidth=9;x.strokeStyle='#ff5fa2';x.fillStyle='#fff';const s=(S.solf?SOL[S.lang][n.key]+' · ':'')+LET[n.key]+(n.sh?' ⇧':'');x.strokeText(s,W/2,H*.38);x.fillText(s,W/2,H*.38)}x.globalAlpha=1}
function tick(ts){requestAnimationFrame(tick);const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;const t=now();
if(st=='play'){if((E()||idx<30)&&t>=nextSp&&stars.filter(s=>!s.st).length<3)spawn(t);for(const s of stars)if(!s.st&&t>s.hit+250)miss(s,t);
if(!E()&&idx>=30&&!stars.some(s=>!s.st))finish(true);fx.forEach(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt});fx=fx.filter(p=>p.l>0)}
stars=stars.filter(s=>!s.st||t-s.rt<800);const nx=stars.filter(s=>!s.st).sort((a,b)=>a.hit-b.hit)[0];cat.x+=((nx?W*(nx.lane+.5)/4:W/2)-cat.x)*Math.min(1,dt*7);draw(t,dt)}

/* UI */
function ui(){document.documentElement.lang=S.lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
$('#snd').textContent=(S.mute?'🔇 ':'🔊 ')+tr(S.mute?'mut':'snd');$('#lng').textContent=S.lang=='en'?'ไทย':'EN';
document.querySelectorAll('.k[data-k]').forEach(b=>{const i=b.lastChild;i.textContent=SOL[S.lang][LET.indexOf(b.dataset.k)];i.style.visibility=S.solf?'visible':'hidden'});
document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m==S.mode));$('#lm').textContent=tr('lm')[MODES.indexOf(S.mode)];
$('#lvs').innerHTML=LV.map((_,i)=>{const n=S.stars[i+1]||0;return`<button class="b s lv${S.level==i+1?' sel':''}" data-l="${i+1}" aria-label="${tr('lvl')} ${i+1}">${i+1}<small>${'★'.repeat(n)}${'☆'.repeat(3-n)}</small></button>`}).join('');
$('#ln').textContent=tr('lvl')+' '+S.level+': '+tr('ln')[S.level-1];$('#bst').textContent=tr('bst')+': '+(S.best[S.mode+(E()?'':S.level)]||0);
$('#spd').value=S.speed;$('#sv').textContent='×'+(+S.speed).toFixed(1);$('#o1').checked=S.solf;$('#o2').checked=S.hints;$('#o3').checked=S.rm;$('#o4').checked=S.acc;hud()}
for(const k of 'ABCDEFG'){const b=document.createElement('button');b.className='k';b.dataset.k=k;b.innerHTML=`<b>${k}</b><i></i>`;$('#keys').insertBefore(b,$('#sh'))}
$('#keys').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();au();if(b.id=='sh'){latch=!latch;b.classList.toggle('on',latch);b.setAttribute('aria-pressed',latch)}else{const l=latch;latch=false;$('#sh').classList.remove('on');press(LET.indexOf(b.dataset.k),l)}});
$('#menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.m)S.mode=b.dataset.m;else if(b.dataset.l)S.level=+b.dataset.l;else return;save();ui()};
$('#play').onclick=startGame;$('#rt').onclick=startGame;$('#rst').onclick=startGame;$('#res').onclick=tp;$('#pbtn').onclick=e=>{e.target.blur();tp()};$('#mn1').onclick=toMenu;$('#mn2').onclick=toMenu;
$('#nx').onclick=()=>{S.level++;save();startGame()};$('#snd').onclick=()=>{S.mute=!S.mute;save();ui()};$('#lng').onclick=()=>{S.lang=S.lang=='en'?'th':'en';save();ui()};
$('#setb').onclick=$('#setp').onclick=()=>show('#set');$('#cls').onclick=()=>hide('#set');
$('#spd').oninput=e=>{S.speed=+e.target.value;$('#sv').textContent='×'+S.speed.toFixed(1);save()};
[['o1','solf'],['o2','hints'],['o3','rm'],['o4','acc']].forEach(([i,k])=>$('#'+i).onchange=e=>{S[k]=e.target.checked;save();ui()});
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code=='Space'||e.code=='Escape'){e.preventDefault();if($('#set').classList.contains('on'))hide('#set');else tp();return}
const m=/^Key([A-G])$/.exec(e.code);if(m&&st=='play'){e.preventDefault();press(LET.indexOf(m[1]),e.shiftKey)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st=='play')tp()});
size();ui();requestAnimationFrame(tick);
</script></body></html>
